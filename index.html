<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="./style.css">
    <!-- <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon"> -->
    <script src="./javascript.js" defer></script>
</head>
<body>

    <div id="header">Tic-tac-toe</div>

    <div id="game-board">
        <li class="game-board-cell" id="0"></li>
        <li class="game-board-cell" id="1"></li>
        <li class="game-board-cell" id="2"></li>
        <li class="game-board-cell" id="3"></li>
        <li class="game-board-cell" id="4"></li>
        <li class="game-board-cell" id="5"></li>
        <li class="game-board-cell" id="6"></li>
        <li class="game-board-cell" id="7"></li>
        <li class="game-board-cell" id="8"></li>
    </div>

    <div id="player-details">

        <form id="player-details-form" action="">
            <div id="player-one-container">
                <h3>Player One</h3>
                
                <label for="player-one-name">name</label>
                <input type="text" name="player-one-name" id="player-one-name" required>


            </div>
            <div id="player-two-container">
                <h3>Player Two</h3>
                <label for="player-two-name">name</label>
                <input type="text" name="player-two-name" id="player-two-name" required>
            </div>

            <fieldset>
                <legend>Who will play as X?</legend>
                <div>
                    <input type="radio" id="player-one-x" name="x-player"  value="player-one-x" checked/>
                    <label id="player-one-x-label" for="player-one-x">Player One</label>
                </div>
                <div>
                    <input type="radio" id="player-two-x" name="x-player" value="player-two-x /">
                    <label id="player-two-x-label" for="player-two-x">Player Two</label>
                </div>
            </fieldset>

            <div id="button-container">
                <button id="new-game-button" type="submit" class="button-89">New Game</button>
            </div>

        </form>
        </div>
    </div>


    <div id="game-info-container">
        <div id="game-info">Please enter your names and click "New Game"</div>
    </div>

    <footer>
      <p>
        Copyright ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        <a href="https://github.com/sloanetribble" target="_blank">
        Sloane Tribble
        <img class="github-logo" src="./assets/github-mark.svg" />
      </a>
      </p>
    </footer>

</body>
</html>
